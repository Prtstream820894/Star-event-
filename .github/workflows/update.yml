name: Auto Update Playlist & Images

on:
  schedule:
    - cron: '*/30 * * * *' # Har 30 minute me run hoga
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install sharp

      - name: Run Script
        run: node update_playlist.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "IPTV Bot"
          git config --global user.email "bot@github.com"
          git add -A
          git commit -m "Auto-update playlist and real PNG images [skip ci]" || exit 0
          git push
